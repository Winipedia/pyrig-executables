---
"name": "Release"
"on":
  "workflow_run":
    "branches":
      - "main"
    "types":
      - "completed"
    "workflows":
      - "Health Check"
"permissions": {}
"concurrency":
  "group": "${{ github.workflow }}-${{ github.ref }}"
  "cancel-in-progress": false
"defaults":
  "run":
    "shell": "bash"
"env":
  "PYTHONDONTWRITEBYTECODE": 1
  "UV_NO_SYNC": 1
"run-name": "Release"
"jobs":
  "executable":
    "name": "Executable"
    "permissions":
      "contents": "read"
    "if": |-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    "runs-on": "${{ matrix.os }}"
    "strategy":
      "matrix":
        "os":
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
      "fail-fast": true
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        "uses": "actions/checkout@main"
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        "uses": "astral-sh/setup-uv@main"
        "with":
          "python-version": "3.14"
      -
        "name": "Install Dependencies"
        "id": "install-dependencies"
        "run": "uv sync"
      -
        "name": "Build Executable"
        "id": "build-executable"
        "run": |-
          uv \
          run \
          pyinstaller \
          --onefile \
          --name=pyrig-executables-${{ runner.os }} \
          --icon=src/pyrig_executables/rig/resources/icon.png \
          --collect-data=pyrig_executables.rig.resources \
          src/pyrig_executables/main.py
      -
        "name": "Upload Executable"
        "id": "upload-executable"
        "uses": "actions/upload-artifact@main"
        "with":
          "name": "executable-${{ runner.os }}"
          "path": "dist"
  "publish":
    "name": "Publish"
    "permissions":
      "contents": "write"
    "if": |-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        "uses": "actions/checkout@main"
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        "uses": "astral-sh/setup-uv@main"
        "with":
          "python-version": "3.14"
      -
        "name": "Configure Repository"
        "id": "configure-repository"
        "run": "bash .github/configure.sh"
        "env":
          "GH_TOKEN": "${{ secrets.REPO_TOKEN }}"
      -
        "name": "Download Executables"
        "id": "download-executables"
        "uses": "actions/download-artifact@main"
        "with":
          "pattern": "executable-*"
          "path": "dist"
          "merge-multiple": "true"
      -
        "name": "Create Release"
        "id": "create-release"
        "run": |-
          gh \
          release \
          create \
          $(uv version --short) \
          dist/* \
          --title=$(uv version --short) \
          --generate-notes
        "env":
          "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
    "needs":
      - "executable"
...
