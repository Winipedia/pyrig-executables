---
"name": "Release"
"on":
  "push":
    "branches":
      - "main"
"permissions": {}
"concurrency":
  "group": "Release-${{ github.ref }}"
  "cancel-in-progress": false
"defaults":
  "run":
    "shell": "bash"
"run-name": "Release"
"jobs":
  "executable":
    "name": "Executable"
    "permissions":
      "contents": "read"
    "runs-on": "${{ matrix.os }}"
    "strategy":
      "matrix":
        "os":
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
      "fail-fast": true
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        # ryl disable-line rule:line-length
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        # ryl disable-line rule:line-length
        "uses": "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884"  # v10.3.0
        "with":
          "python-version": "3.15"
      -
        "name": "Install Dependencies"
        "id": "install-dependencies"
        "run": "uv sync"
      -
        "name": "Build Executable"
        "id": "build-executable"
        "run": |-
          uv \
          run \
          pyinstaller \
          --onefile \
          --name=pyrig-executables-"${OS}" \
          --icon=src/pyrig_executables/rig/resources/icon.png \
          --collect-data=pyrig_executables.rig.resources \
          src/pyrig_executables/main.py
        "env":
          "OS": "${{ runner.os }}"
      -
        "name": "Upload Executable"
        "id": "upload-executable"
        # ryl disable-line rule:line-length
        "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"  # v7.0.2
        "with":
          "name": "executable-${{ runner.os }}"
          "path": "dist"
  "health-check":
    "name": "Health Check"
    "permissions":
      "actions": "read"  # required
      "contents": "read"
      "security-events": "write"  # required
    "uses": "$/.github/workflows/health_check.yml"
    "secrets":
      "CODECOV_TOKEN": "${{ secrets.CODECOV_TOKEN }}"
  "publish":
    "name": "Publish"
    "permissions":
      "contents": "write"  # required
    "needs":
      - "health-check"
      - "executable"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        # ryl disable-line rule:line-length
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        # ryl disable-line rule:line-length
        "uses": "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884"  # v10.3.0
        "with":
          "python-version": "3.15"
      -
        "name": "Extract Version"
        "id": "extract-version"
        "run": |-
          VERSION="$(uv version --short)"
          echo version="${VERSION}" >> "${GITHUB_OUTPUT}"
      -
        "name": "Download Executables"
        "id": "download-executables"
        # ryl disable-line rule:line-length
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"  # v8.0.2
        "with":
          "pattern": "executable-*"
          "path": "dist"
          "merge-multiple": "true"
      -
        "name": "Create Release"
        "id": "create-release"
        "run": |-
          gh \
          release \
          create \
          "${VERSION}" \
          dist/* \
          --title="${VERSION}" \
          --generate-notes
        "env":
          "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          "VERSION": "${{ steps.extract-version.outputs.version }}"
  "deploy":
    "name": "Deploy"
    "permissions":
      "contents": "read"
      "id-token": "write"  # required
      "pages": "write"  # required
    "needs":
      - "publish"
    "uses": "$/.github/workflows/deploy.yml"
    "secrets":
      "REPO_TOKEN": "${{ secrets.REPO_TOKEN }}"
...
