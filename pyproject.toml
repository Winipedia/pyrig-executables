[project]
name = "pyrig-executables"
version = "3.18.63"
description = "A pyrig plugin to build executables."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = [
  "LICENSE",
]
authors = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
maintainers = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
keywords = [
  "pyrig",
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pyrig>=18.86.0",
  "pyrig-resources>=3.13.74",
]

[project.urls]
Changelog = "https://github.com/Winipedia/pyrig-executables/releases"
Documentation = "https://Winipedia.github.io/pyrig-executables"
Homepage = "https://github.com/Winipedia/pyrig-executables"
Issues = "https://github.com/Winipedia/pyrig-executables/issues"
Source = "https://github.com/Winipedia/pyrig-executables"

[project.scripts]
pyrig-executables = "pyrig_runtime.rig.cli.main:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "detect-secrets>=1.5.0",
  "mkdocstrings[python]>=1.0.6",
  "pillow>=12.3.0",
  "pre-commit-hooks>=6.0.0",
  "prek>=0.5.3",
  "pyflakes>=3.4.0",
  "pyinstaller>=6.22.3",
  "pyrig-opensource>=1.0.0",
  "pyrig-plugin>=0.1.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=5.0.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.8",
  "rumdl>=0.2.75",
  "ryl>=0.22.0",
  "shellcheck-py>=0.11.0.1",
  "shfmt-py>=4.2.0",
  "tombi>=1.5.5",
  "ty>=0.0.83",
  "typos>=1.50.2",
  "vulture>=2.16",
  "zensical>=0.0.64",
  "zizmor>=1.30.1",
]

[build-system]
requires = [
  "uv-build",
]
build-backend = "uv_build"

[tool.deptry]
root = "src"

[tool.deptry.per_rule_ignores]
DEP002 = [
  "pyrig",
]

[tool.pytest]
addopts = [
  "--cov-branch",
  "--cov-fail-under=100",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov=pyrig_executables",
  "--dist=worksteal",
  "--numprocesses=auto",
  "--report-chars=a",
]
filterwarnings = [
  "error",
]
strict = true
testpaths = [
  "tests",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "CPY001",
]
select = [
  "ALL",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ryl.rules]
ALL = "enable"
key-ordering = "disable"

[tool.vulture]
paths = [
  "src",
  "vulture_whitelist.py",
]
